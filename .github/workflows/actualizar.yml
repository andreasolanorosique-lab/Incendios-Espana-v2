name: Generar KML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extraer red de gas
        run: python extraer_gasoductos.py

      - name: Generar KML de incendios
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python generar_kml.py

      - name: Comprobar archivos generados
        run: |
          echo "=== Estado del repositorio ==="
          git status
          echo ""
          echo "=== Archivos generados ==="
          ls -lh incendios_actual.kml

          if [ -f infraestructuras/gasoductos/gasoductos.json ]; then
            ls -lh infraestructuras/gasoductos/gasoductos.json
          fi

          if [ -f infraestructuras/posiciones/catalogo_posiciones.json ]; then
            ls -lh infraestructuras/posiciones/catalogo_posiciones.json
          fi

      - name: Guardar cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar KML y red de gas"
          add_options: "-A"

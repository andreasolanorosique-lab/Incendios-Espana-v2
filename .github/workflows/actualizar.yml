name: Generar KML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Extraer red de gas
        run: python extraer_gasoductos.py

      - name: Extraer posiciones
        run: python extraer_posiciones.py

      - name: Generar KML de incendios
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python generar_kml.py

      - name: Ver estado de Git
        run: |
          git status
          git diff --stat

          echo ""
          echo "=== KML ==="
          ls -lh incendios_actual.kml

          echo ""
          echo "=== Gasoductos ==="
          if [ -f infraestructuras/gasoductos/gasoductos.json ]; then
            ls -lh infraestructuras/gasoductos/gasoductos.json
          fi

          echo ""
          echo "=== Posiciones ==="
          if [ -f infraestructuras/posiciones/catalogo_posiciones.json ]; then
            ls -lh infraestructuras/posiciones/catalogo_posiciones.json
          fi

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar KML, gasoductos y posiciones"
          add_options: "-A"
